# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '519c1482-c369-4c98-b2e3-e515190e93fb'
  imageRepository: 'containertodoapp'
  containerRegistry: 'demo1registry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'Azure subscription 1(8b303a18-46ae-4194-865b-860a7315604f)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: 'az acr login --name demo1registry'
    - task: Docker@2
      displayName: Login to Docker Hub
      inputs:
        command: login
        containerRegistry: dockerhub-connection

    - task: Docker@2 
      displayName: Build and push an image to container registry
      inputs: 
        command: buildAndPush 
        repository: $(imageRepository) 
        dockerfile: $(dockerfilePath) 
        containerRegistry: $(dockerRegistryServiceConnection) 
        tags: |
          $(tag)     
    - task: AzureCLI@2    
      inputs:
        azureSubscription: 'Azure subscription 1(8b303a18-46ae-4194-865b-860a7315604f)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az container create \
          --name app1 \
          --resource-group demo-resource \
          --image $(containerRegistry)/$(imageRepository):$(tag) \
          --registry-login-server $(containerRegistry) \
          --registry-username demo1registry  \
          --registry-password EWmdgH8YpvkUO3p6WIVHsbp8xGde2qIdOLPXinh4j1REzCuFtVpKJQQJ99CBACGhslBEqg7NAAACAZCRtJ6I \
          --dns-name-label divya-aci-app \
          --ports 80 \
           --os-type Linux \
           --cpu 1 \
           --memory 1.5
